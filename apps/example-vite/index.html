<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>monowind — standalone Vite example</title>
    <!-- No stylesheet, no script: the @monowind/vite plugin injects both. -->
  </head>
  <body class="bg-abyss text-ice min-h-screen p-8">
    <mono-wind>
      <div class="border-ice flex min-h-5 items-center justify-between border px-1">
        <div>standalone mode: markup is all you write</div>
        <button class="cursor-pointer">native button</button>
      </div>
    </mono-wind>
  </body>
</html>
