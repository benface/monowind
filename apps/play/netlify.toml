# Netlify site config for the deployed playground (site: monowind-play,
# → play.monowind.benface.com).
#
# Netlify does NOT build this site: no repository is linked, so pushes
# never trigger (or bill) a Netlify build. Instead, the release workflow
# (.github/workflows/release.yml) builds on GitHub Actions and pushes
# the finished files with `netlify deploy --prod` — the site updates
# once per release.
#
# The publish directory below still applies to those CLI deploys; the
# build command is kept for anyone deploying manually with
# `netlify build && netlify deploy`.

[build]
command = "pnpm --filter @monowind/play build"
publish = "dist"

# Short links (netlify/functions: share.mjs stores this site's own
# location under a content id in Netlify Blobs, resolve.mjs redirects
# /s/<id> to it). The CLI does not pick this directory up from inside
# the workspace package, so `deploy` and a local `functions:serve` pass
# it explicitly (`--functions netlify/functions`); it stays here for
# `netlify build`.
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[build.environment]
NODE_VERSION = "24"
