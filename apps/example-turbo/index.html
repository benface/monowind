<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>monowind — Turbo example</title>
    <!-- Three classic scripts, no build step. In a real page:
         <script src="https://unpkg.com/monowind/dist/cdn.js"></script>
         <script src="https://unpkg.com/@monowind/ui/dist/cdn.js"></script>
         <script src="https://unpkg.com/@hotwired/turbo"></script>
         (the local copies come from copy-vendor.mjs) -->
    <script src="./cdn.js"></script>
    <script src="./ui-cdn.js"></script>
    <script src="./turbo.js"></script>
  </head>
  <body class="min-h-screen bg-neutral-900 p-8 text-neutral-100">
    <!-- Turbo navigates a frame when a link inside it is followed, and
         a menu item is an ordinary link: the <mono-menu> mounts itself
         and Zag gives the item its role, while the anchor stays what
         Turbo understands. Nothing here is written in JavaScript. -->
    <mono-wind>
      <p>A page Turbo drives, with components written as elements.</p>

      <turbo-frame id="log" class="mt-1 block">
        <div class="flex items-center gap-2">
          <mono-menu placement="bottom-start">
            <button data-part="trigger" class="border px-1">Branch</button>
            <div data-part="positioner" popover="manual">
              <div data-part="content" class="border bg-clear">
                <div
                  data-part="item"
                  data-value="main"
                  class="px-1 data-highlighted:bg-(--mw-fg) data-highlighted:text-(--mw-bg)"
                >
                  <a href="./fragments/main.html">main</a>
                </div>
                <div
                  data-part="item"
                  data-value="next"
                  class="px-1 data-highlighted:bg-(--mw-fg) data-highlighted:text-(--mw-bg)"
                >
                  <a href="./fragments/next.html">next</a>
                </div>
              </div>
            </div>
          </mono-menu>
          <span>nothing picked yet</span>
        </div>
      </turbo-frame>

      <p class="mt-1">More of the page, under the menu.</p>
    </mono-wind>
  </body>
</html>
