packages:
  - apps/*
  - packages/*
minimumReleaseAge: 1440 # default in pnpm 11, but `npm-check-updates` needs it to be explicit
allowBuilds:
  # Panda's watcher (apps/example-panda) and StyleX's compiler
  # (apps/example-stylex) use prebuilt bindings, so their own build
  # scripts are not needed.
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
tasks:
  # A smoke serves its packages' CDN bundles as last built, rebuilt
  # first by a run selecting them too (`pnpm -r`, `--filter "<app>..."`).
  test:
    dependsOn: ["^build"]
