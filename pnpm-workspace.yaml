packages:
  - apps/*
  - packages/*
minimumReleaseAge: 1440 # default in pnpm 11, but `npm-check-updates` needs it to be explicit
allowBuilds:
  # StyleX's compiler pulls it in (apps/example-stylex) but uses a
  # prebuilt binding, so its own build script is not needed.
  "@swc/core": false
  esbuild: true
minimumReleaseAgeExclude:
  - "@oxlint/binding-linux-x64-musl@1.85.0"
