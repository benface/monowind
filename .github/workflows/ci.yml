name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Story tests run a full engine matrix (Chromium + Firefox + WebKit —
      # Firefox pre-157 exercises the class-scan fallback instead of Typed
      # OM); the example smoke tests use Chromium.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check

  visual:
    name: Visual regression
    # Screenshots proved byte-identical between arm64 (local Apple Silicon
    # Docker) and amd64 (this runner) for our rendering — see the note in
    # scripts/test-visual.mjs. If that ever changes, pin one architecture on
    # both sides.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-visual.mjs
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: apps/storybook/test-results
          retention-days: 7
